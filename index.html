<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Stardew Valley</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Menu latéral -->
        <nav class="sidebar">
            <h2>Stardew Wiki</h2>
            <ul id="menu">
                <li onclick="loadCategory('NPCs')" class="active">👤 Personnages (PNJ)</li>
                <li onclick="loadCategory('Agriculture')">🌱 Agriculture</li>
                <li onclick="loadCategory('Poissons')">🐟 Poissons</li>
                <li onclick="loadCategory('Objets')">🧱 Objets</li>
                <li onclick="loadCategory('Crafts')">🔨 Crafts & Recettes</li>
            </ul>
        </nav>

        <!-- Contenu principal -->
        <main class="main-content">
            <h1 id="category-title">Personnages (PNJ)</h1>
            
            <!-- Zone pour le PNJ aléatoire (uniquement visible dans la catégorie PNJ) -->
            <div id="featured-container" class="featured-card hidden">
                <div class="featured-label">⭐ En vedette (Change toutes les 10s)</div>
                <div id="featured-content" class="featured-content"></div>
            </div>

            <!-- Grille des objets -->
            <div id="grid-container" class="grid-container"></div>
        </main>
    </div>

    <!-- Fenêtre de détails (Modal Wiki) -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-wrapper">
            <button id="modal-close" class="close-btn">&times;</button>
            <div class="modal-header">
                <img id="modal-img" src="" alt="">
                <h2 id="modal-title">Titre</h2>
            </div>
            <div id="modal-body" class="modal-body">
                <!-- Le contenu détaillé (tableaux, listes) sera injecté ici par JavaScript -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
