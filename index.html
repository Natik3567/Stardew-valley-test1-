<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardew Valley Wiki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button id="toggle-sidebar" class="icon-btn">☰</button>
                <h2 class="sidebar-title">SDV Wiki</h2>
            </div>
            <ul id="menu">
                <li onclick="loadView('home')" id="nav-home" class="active"><span class="icon">🏠</span><span class="text" data-i18n="nav_home">Accueil</span></li>
                <li onclick="loadView('category', 'NPCs')" id="nav-NPCs"><span class="icon">👤</span><span class="text" data-i18n="nav_npcs">Personnages</span></li>
                <li onclick="loadView('category', 'Farming')" id="nav-Farming"><span class="icon">🌱</span><span class="text" data-i18n="nav_farming">Agriculture</span></li>
                <li onclick="loadView('category', 'Fish')" id="nav-Fish"><span class="icon">🐟</span><span class="text" data-i18n="nav_fish">Poissons</span></li>
                <li onclick="loadView('category', 'Items')" id="nav-Items"><span class="icon">🧱</span><span class="text" data-i18n="nav_items">Objets</span></li>
                <li onclick="loadView('category', 'Crafting')" id="nav-Crafting"><span class="icon">🔨</span><span class="text" data-i18n="nav_crafts">Crafts & Recettes</span></li>
            </ul>
        </nav>

        <!-- Contenu principal -->
        <main class="main-content">
            <!-- Barre supérieure (Recherche + Langue) -->
            <header class="top-bar">
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="global-search" placeholder="Rechercher..." data-i18n-placeholder="search_placeholder">
                </div>
                <button id="lang-toggle" class="lang-btn">🇫🇷 FR</button>
            </header>

            <!-- Zone de contenu dynamique -->
            <div id="content-area"></div>
        </main>
    </div>

    <!-- Fenêtre modale (Fiche détaillée) -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-wrapper">
            <button id="modal-close" class="close-btn">&times;</button>
            <div class="modal-header">
                <img id="modal-img" src="" alt="">
                <h2 id="modal-title"></h2>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <!-- Il est crucial de charger data.js AVANT app.js -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
